server {
    listen       80;
    server_name  localhost;

    # Ocultar la versión de Nginx por seguridad
    server_tokens off;

    # ── index.html: NUNCA cachear ──────────────────────────────────────────────
    # Tanto para /index.html directo como para cualquier ruta SPA (fallback).
    location = /index.html {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        expires off;
    }

    # ── Assets de Expo con hash en el nombre (_expo/static/js|css) ────────────
    # Es SEGURO cachear con immutable porque Expo cambia el hash al cambiar el código.
    location ~* ^/_expo/static/ {
        root   /usr/share/nginx/html;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Otros assets estáticos (fuentes, íconos, imágenes) ───────────────────
    location ~* \.(?:ico|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        root   /usr/share/nginx/html;
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000";
    }

    # ── SPA Routing: todas las rutas sirven index.html ────────────────────────
    # Aquí también forzamos no-cache para que no quede viejo en el browser.
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        expires off;
    }

    # ── Bloquear acceso a archivos ocultos (seguridad) ────────────────────────
    location ~ /\. {
        deny all;
    }
}
