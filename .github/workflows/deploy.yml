name: CI/CD Frontend Q Hubo Mor

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Parse SSH Credentials
        id: parse
        env:
          AUTH_SERVER: ${{ secrets.AUTH_SERVER }}
        run: |
          if [[ "$AUTH_SERVER" == *"@"* ]]; then
            echo "username=$(echo $AUTH_SERVER | cut -d'@' -f1)" >> $GITHUB_OUTPUT
            echo "host=$(echo $AUTH_SERVER | cut -d'@' -f2)" >> $GITHUB_OUTPUT
          else
            echo "username=root" >> $GITHUB_OUTPUT
            echo "host=$AUTH_SERVER" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Contabo VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.parse.outputs.host }}
          username: ${{ steps.parse.outputs.username }}
          password: ${{ secrets.AUTH_PASS }}
          command_timeout: 30m
          script: |
            set -e
            
            # 0. Limpiar imagenes viejas del proyecto y caché de construcción
            echo "Limpiando espacio en disco de imagenes viejas..."
            docker image prune -f || true
            docker builder prune -f || true
            
            # 1. Crear directorio del proyecto si no existe
            mkdir -p /root/frontend-qhubomor
            cd /root/frontend-qhubomor
            
            # 2. Clonar el repositorio o actualizarlo si ya existe
            if [ ! -d ".git" ]; then
              echo "Clonando repositorio por primera vez..."
              # Reemplaza 'JhonnM62/frontend-repo' por el nombre real de tu repositorio en GitHub
              git clone https://${{ secrets.TOKEN_REACTNATIVEQHUBOMOR }}@github.com/JhonnM62/apppuntodeventa.git .
            else
              echo "Actualizando repositorio existente..."
              # Asegúrate de colocar la ruta correcta de tu repositorio en GitHub
              git remote set-url origin https://${{ secrets.TOKEN_REACTNATIVEQHUBOMOR }}@github.com/JhonnM62/apppuntodeventa.git
              git fetch --all
              git reset --hard origin/main
              git clean -fd
            fi
            
            # 3. Inyectar las variables de entorno desde los secretos de GitHub
            echo "${{ secrets.ENV_FILE_CONTENT }}" > .env
            
            # 4. Construir la nueva imagen de Docker (sin cache)
            echo "Construyendo imagen Docker para web..."
            docker build --no-cache -t qhubomor-frontend .
            
            # 5. Detener y eliminar el contenedor anterior si existe
            echo "Deteniendo contenedor anterior..."
            docker stop qhubomor-frontend-app || true
            docker rm qhubomor-frontend-app || true
            
            # 6. Levantar el nuevo contenedor en el puerto 8062
            echo "Levantando nuevo contenedor..."
            docker run -d \
              --name qhubomor-frontend-app \
              -p 8062:80 \
              --restart unless-stopped \
              qhubomor-frontend
            
            echo "¡Despliegue del Frontend completado exitosamente!"

            # =========================================================
            # FÁBRICA DE NUEVOS FRONTENDS WEB
            # Importante: cada cliente requiere su propia imagen porque
            # la URL del backend queda "quemada" en el build de Expo/React.
            # Para agregar un cliente: copia la llamada de abajo y cambia
            # los parámetros (CLIENT_ID, PUERTO, DOMINIO, API_URL, SECRETO).
            # =========================================================
            deploy_new_client_web() {
              CLIENT_ID=$1
              PORT=$2
              DOMAIN=$3
              API_URL=$4
              ENV_EXTRA=$5

              echo "🚀 Desplegando Frontend para: $CLIENT_ID en $DOMAIN:$PORT"

              # Crear .env con la URL del backend de este cliente
              # ENV_EXTRA puede incluir variables adicionales del frontend
              printf '%s\n' "$ENV_EXTRA" > /root/frontend-qhubomor/.env.$CLIENT_ID
              echo "EXPO_PUBLIC_API_URL=$API_URL" >> /root/frontend-qhubomor/.env.$CLIENT_ID

              # Copiar el .env al directorio raíz para que Docker lo tome en el build
              cp /root/frontend-qhubomor/.env.$CLIENT_ID /root/frontend-qhubomor/.env

              # Compilar imagen única para este cliente (con su API URL)
              echo "Compilando imagen para $CLIENT_ID..."
              cd /root/frontend-qhubomor
              docker build --no-cache -t frontend-$CLIENT_ID .

              # Detener y eliminar contenedor anterior de este cliente
              docker stop frontend-$CLIENT_ID || true
              docker rm frontend-$CLIENT_ID || true

              # Levantar el nuevo contenedor
              docker run -d \
                --name frontend-$CLIENT_ID \
                -p $PORT:80 \
                --restart unless-stopped \
                frontend-$CLIENT_ID

              # Configurar subdominio + certificado SSL automáticamente usando el script de n8n
              DOMAIN=$DOMAIN PORT=$PORT EMAIL=jonnymejia62@gmail.com \
                bash /root/frontend-qhubomor/scripts/setup-nginx.sh

              echo "✅ Frontend $CLIENT_ID desplegado en https://$DOMAIN"
            }

            # ----------------------------------------------------------
            # LISTA DE CLIENTES ACTIVOS
            # Para agregar uno nuevo: copia la línea de abajo,
            # cambia los valores y crea el secreto en GitHub.
            # ----------------------------------------------------------
            deploy_new_client_web \
              "restaurante2" \
              "8072" \
              "app-restaurante2.autosystemprojects.site" \
              "https://api-restaurante2.autosystemprojects.site/api/v1" \
              "${{ secrets.ENV_FRONTEND_RESTAURANTE2 }}"

